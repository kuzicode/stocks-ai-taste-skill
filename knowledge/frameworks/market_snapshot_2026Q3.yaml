    MSFT: "TTM $116.0B（截至 2026-06），TTM YoY +79.6%，二阶导 +21.1pp → 仍在加速"
    GOOGL: "TTM $132.4B（截至 2026-06），TTM YoY +97.7%，二阶导 +7.3pp → 仍在加速"
    AMZN: "TTM $173.0B（截至 2026-06），TTM YoY +60.7%，二阶导 -1.5pp → 走平"
    META: "TTM $89.3B（截至 2026-06），TTM YoY +71.2%，二阶导 -1.8pp（此前两季 -19/-14pp）→ 走平"
    ORCL: "TTM $75.7B（截至 2026-08），TTM YoY +176%，单季波动大"
