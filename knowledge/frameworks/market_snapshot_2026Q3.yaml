    已披露实际值（截至 2026Q2）：MSFT/GOOGL 的 TTM 增速仍在加速，AMZN/META 走平，四家合计还没出现二阶导转负。
    「增速放缓」目前只体现在 2027 指引的隐含 YoY（约 +30-60%，低于 2026 年）。
    → 7 月以来的「芯片 → 云厂商」轮动是市场在**提前交易**预期放缓，并不是实际数据已经放缓；
      判断全链 de-rate 前，以 sec_facts.py 的 TTM 二阶导连续 2 季为负为准。
  tracking: "python3 scripts/sec_facts.py --capex（季度实际 capex 序列 + YoY + 二阶导）"

